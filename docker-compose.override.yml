# ============================================================
# Docker Compose Override - DESARROLLO LOCAL
# ============================================================
# Este archivo sobreescribe configuraciones para desarrollo.
# Se aplica automaticamente al usar docker compose en la misma carpeta.
#
# Para produccion, renombrar este archivo:
#   mv docker-compose.override.yml docker-compose.override.yml.dev
# ============================================================

# NOTA: Este override aplica solo si usas un unico docker-compose.yml
# Con la arquitectura de 4 archivos, usa este como referencia para
# modificar los compose files individuales en modo desarrollo.

