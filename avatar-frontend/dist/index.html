<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Influencer Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <!-- Fondo: AI-generated background (Stable Diffusion) o CSS gradient -->
  <div id="ai-background"></div>

  <!-- Efectos ambient: capa de color/luz segun emocion del avatar -->
  <div id="ambient-fx"></div>

  <!-- Contenedor principal del avatar 3D -->
  <div id="avatar"></div>

  <!-- Fondo personalizado en video -->
  <video id="bg-video" autoplay muted loop playsinline></video>

  <!-- Pantalla compartida: canvas evita hardware overlay planes de Chromium -->
  <canvas id="screen-canvas"></canvas>

  <!-- Prompt para activar screen share (requiere clic del usuario) -->
  <div id="screenshare-prompt">
    <button id="screenshare-btn">🖥️ Clic para compartir pantalla</button>
  </div>

  <!-- Overlay: informacion del producto -->
  <div id="product-overlay">
    <button id="product-close" onclick="document.getElementById('product-overlay').style.display='none'">&times;</button>
    <div id="product-image-container">
      <img id="product-image" src="" alt="Producto">
      <video id="product-video" autoplay muted loop playsinline></video>
    </div>
    <div id="product-info">
      <h3 id="product-name"></h3>
      <p id="product-original-price"></p>
      <p id="product-price"></p>
      <div id="product-timer" style="display:none">
        <span id="product-timer-label">Oferta termina en</span>
        <div class="timer-blocks">
          <div class="timer-block">
            <span class="timer-block-label">MIN</span>
            <span id="timer-min" class="timer-block-num">00</span>
          </div>
          <span class="timer-sep">:</span>
          <div class="timer-block">
            <span class="timer-block-label">SEG</span>
            <span id="timer-sec" class="timer-block-num">00</span>
          </div>
        </div>
      </div>
      <ul id="product-features"></ul>
    </div>
    <div id="product-qr">
      <img id="product-qr-img" src="" alt="Escanea para comprar">
      <p id="product-qr-label">Escanea para comprar</p>
    </div>
  </div>

  <!-- Overlay: chat en vivo -->
  <div id="chat-overlay">
    <div id="chat-header">Chat en Vivo</div>
    <div id="chat-messages"></div>
  </div>

  <!-- Overlay: estado del stream -->
  <div id="status-bar">
    <span id="status-indicator"></span>
    <span id="status-text">Conectando...</span>
  </div>


  <script type="module" src="js/app.mjs"></script>
</body>
</html>
