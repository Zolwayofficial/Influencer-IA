<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Avatar Test</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>
  <style>
    body { margin: 0; background: #222; color: #0f0; font-family: monospace; }
    #avatar { width: 100vw; height: 100vh; }
    #log { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.9); padding: 15px; font-size: 13px; max-height: 80vh; overflow-y: auto; z-index: 999; white-space: pre-wrap; max-width: 60vw; border: 1px solid #0f0; }
  </style>
</head>
<body>
  <div id="avatar"></div>
  <div id="log"></div>
  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Capturar errores globales
    window.onerror = (msg, src, line, col, err) => {
      log(`GLOBAL ERROR: ${msg} at ${src}:${line}:${col}`);
    };
    window.onunhandledrejection = (e) => {
      log(`UNHANDLED PROMISE: ${e.reason}`);
    };

    try {
      log('Step 1: Importing TalkingHead module...');
      const { TalkingHead } = await import('talkinghead');
      log('Step 2: TalkingHead imported successfully');

      const el = document.getElementById('avatar');
      log(`Step 3: Avatar container size: ${el.offsetWidth}x${el.offsetHeight}`);

      log('Step 4: Creating TalkingHead instance (no TTS)...');
      const head = new TalkingHead(el, {
        ttsEndpoint: null,
        lipsyncModules: ['en'],
        cameraView: 'upper',
        cameraRotateEnable: true,
        cameraZoomEnable: true,
      });
      log('Step 5: Instance created OK');

      // Test: cargar GLB con progress y timeout
      log('Step 6: Loading avatar GLB with progress tracking...');

      const timeout = setTimeout(() => {
        log('TIMEOUT: showAvatar has been loading for 30 seconds!');
        log('This likely means the GLB file is incompatible or DRACO decoder failed');
      }, 30000);

      const progressCb = (event) => {
        if (event.lengthComputable) {
          const pct = Math.round((event.loaded / event.total) * 100);
          log(`  Progress: ${pct}% (${event.loaded}/${event.total} bytes)`);
        } else {
          log(`  Progress: ${event.loaded} bytes loaded`);
        }
      };

      await head.showAvatar(
        {
          url: '/models/avatar.glb',
          body: 'F',
          avatarMood: 'happy',
        },
        progressCb
      );

      clearTimeout(timeout);
      log('Step 7: Avatar loaded and rendered!');

    } catch (err) {
      log(`ERROR: ${err.message}`);
      log(`Stack: ${err.stack}`);
    }
  </script>
</body>
</html>
