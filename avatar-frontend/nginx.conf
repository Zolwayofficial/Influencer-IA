types {
    application/javascript mjs;
}

resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name control.virtufan.com;
    root /usr/share/nginx/html;
    index control.html;

    location = / { return 302 /control.html; }

    # Mismos proxies que el servidor principal
    location /ctrl/   { set $cb http://chat-bridge:4000; rewrite ^/ctrl/health$ /health break; rewrite ^/ctrl/(.*)$ /api/$1 break; proxy_pass $cb; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location /agent/  { set $oc http://openclaw:3000; rewrite ^/agent/(.*)$ /api/$1 break; proxy_pass $oc; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location /hunter/ { set $ph http://product-hunter:5001; rewrite ^/hunter/(.*)$ /$1 break; proxy_pass $ph; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "public, max-age=3600"; }
    location /health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estaticos del avatar
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Modelos y animaciones 3D - cache largo
    location ~* \.(glb|fbx|gltf|bin)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy WebSocket de comandos al Chat Bridge
    location /ws/commands {
        set $chat_bridge http://chat-bridge:4000;
        proxy_pass $chat_bridge/ws/commands;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy REST de F5-TTS (puerto 8882)
    location /tts/ {
        set $f5tts http://f5-tts:8882;
        rewrite ^/tts/(.*)$ /$1 break;
        proxy_pass $f5tts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Panel de control — proxy al chat-bridge (comandos al avatar)
    location /ctrl/ {
        set $chat_bridge http://chat-bridge:4000;
        rewrite ^/ctrl/health$ /health break;
        rewrite ^/ctrl/(.*)$ /api/$1 break;
        proxy_pass $chat_bridge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Panel de control — health proxy a openclaw
    location = /agent/health {
        set $openclaw http://openclaw:3000;
        proxy_pass $openclaw/health;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Proxy OpenClaw — showcase por query (busca producto con IA)
    location /agent/ {
        set $openclaw http://openclaw:3000;
        rewrite ^/agent/(.*)$ /api/$1 break;
        proxy_pass $openclaw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy Product Hunter — scraping Amazon/Alibaba/1688/Apple
    location /hunter/ {
        set $product_hunter http://product-hunter:5001;
        rewrite ^/hunter/(.*)$ /$1 break;
        proxy_pass $product_hunter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
