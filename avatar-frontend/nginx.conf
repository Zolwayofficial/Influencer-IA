server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estaticos del avatar
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Modelos y animaciones 3D - cache largo
    location ~* \.(glb|fbx|gltf|bin)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy WebSocket de comandos al Chat Bridge
    location /ws/commands {
        proxy_pass http://chat-bridge:4000/ws/commands;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy WebSocket de TTS al HeadTTS oficial (puerto 8882)
    location /tts/ws {
        proxy_pass http://headtts:8882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy REST de TTS
    location /tts/api/ {
        proxy_pass http://headtts:8882/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
