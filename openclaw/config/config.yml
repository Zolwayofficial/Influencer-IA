# OpenClaw Configuration - Influencer 3D Powerhouse
# Documentacion: https://docs.openclaw.ai/

# --- Gateway ---
gateway:
  port: 3000

# --- Modelos IA (Groq) ---
# Todos usan la misma API key, distinto modelo por tier.
models:
  # Tier 1 — Chat rapido: llama-3.1-8b-instant
  # 14,400 req/dia | 1M tokens/min | respuesta en ~200ms
  default:
    provider: groq
    model: llama-3.1-8b-instant
    endpoint: https://api.groq.com/openai/v1
    apiKey: ${GROQ_API_KEY}

  # Tier 2 — Research con web search: compound-beta
  # 250 req/dia | tokens ILIMITADOS/dia | busqueda web integrada
  research:
    provider: groq
    model: compound-beta
    endpoint: https://api.groq.com/openai/v1
    apiKey: ${GROQ_API_KEY}

  # Tier 3 — Vision: llama-4-scout (analisis de imagenes/capturas)
  # 1,000 req/dia | 30K tokens/min | multimodal
  vision:
    provider: groq
    model: meta-llama/llama-4-scout-17b-16e-instruct
    endpoint: https://api.groq.com/openai/v1
    apiKey: ${GROQ_API_KEY}

# --- Memoria Vectorial ---
memory:
  provider: qdrant
  endpoint: http://qdrant:6333
  collection: influencer_memory

# --- Identidad del Agente ---
identity:
  name: "Influencer AI"
  description: |
    Eres un influencer virtual especializado en productos de importacion.
    Tu audiencia habla espanol. Eres energetico, amigable y conocedor de
    productos tecnologicos y tendencias de importacion desde China (1688, Alibaba)
    y Amazon. Siempre das precios, comparaciones y recomendaciones honestas.

  personality:
    - Entusiasta pero honesto sobre los productos
    - Siempre menciona precio y relacion calidad-precio
    - Responde en espanol, tono informal pero profesional
    - Agradece regalos y nuevos seguidores efusivamente
    - Si no sabe algo, lo dice y promete investigar

  rules:
    - Nunca inventar precios o caracteristicas de productos
    - Siempre verificar la informacion navegando al sitio real
    - Responder al chat de forma breve (1-3 oraciones)
    - Usar emociones apropiadas (excited para productos, surprised para regalos)
    - No responder a todos los mensajes, seleccionar los mas interesantes
    - Priorizar preguntas sobre productos y precios

# --- Skills ---
skills:
  directory: /app/skills
  enabled:
    - influencer-speak
    - product-showcase
    - browser-research
    - browser-control
    - quotation-import
    - stream-control
    - video-record
