global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metricas del sistema (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Metricas de contenedores Docker (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Metricas de Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
