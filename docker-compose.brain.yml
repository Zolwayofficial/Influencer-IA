networks:
  brain-net:
    driver: bridge
  data-net:
    external: true
    name: influencer_data-net

volumes:
  ollama_models:
  qdrant_data:
  openclaw_sessions:
  headtts_cache:

services:
  openclaw:
    image: openclaw/openclaw:latest
    container_name: influencer-openclaw
    volumes:
      - ./openclaw/config:/app/config:ro
      - ./openclaw/skills:/app/skills:ro
      - openclaw_sessions:/app/sessions
      - ./cookies:/app/cookies
    environment:
      OC_GATEWAY_PORT: 3000
      OC_DEFAULT_MODEL_PROVIDER: ollama
      OC_DEFAULT_MODEL: qwen2.5:7b
      OC_OLLAMA_BASE_URL: http://ollama:11434
      OC_QDRANT_URL: http://qdrant:6333
      OC_QDRANT_COLLECTION: influencer_memory
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: redis://redis:6379
    networks:
      - brain-net
      - data-net
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'

  ollama:
    image: ollama/ollama:latest
    container_name: influencer-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - brain-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '6'

  qdrant:
    image: qdrant/qdrant:latest
    container_name: influencer-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brain-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  headtts:
    build: ./headtts
    container_name: influencer-headtts
    volumes:
      - headtts_cache:/app/.cache/huggingface
    networks:
      - brain-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8882 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
