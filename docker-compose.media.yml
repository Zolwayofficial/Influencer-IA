networks:
  media-net:
    driver: bridge
  brain-net:
    external: true
    name: influencer_brain-net
  data-net:
    external: true
    name: influencer_data-net

services:
  avatar-frontend:
    image: nginx:alpine
    container_name: influencer-avatar
    volumes:
      - ./avatar-frontend/dist:/usr/share/nginx/html:ro
      - ./avatar-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - brain-net
      - media-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avatar.rule=Host(`avatar.${DOMAIN}`)"
      - "traefik.http.routers.avatar.entrypoints=websecure"
      - "traefik.http.routers.avatar.tls.certresolver=letsencrypt"
      - "traefik.http.services.avatar.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  chat-bridge:
    build: ./chat-bridge
    container_name: influencer-chat-bridge
    environment:
      TIKTOK_SESSION_ID: ${TIKTOK_SESSION_ID}
      TIKTOK_USERNAME: ${TIKTOK_USERNAME}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_VIDEO_ID: ${YOUTUBE_VIDEO_ID}
      REDIS_URL: redis://redis:6379
      OPENCLAW_WEBHOOK_URL: http://openclaw:3000/webhook/chat
      AVATAR_WS_URL: ws://avatar-frontend:8080/ws/commands
      PORT: 4000
    networks:
      - brain-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: influencer-mediamtx
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"       # RTMP
      - "8554:8554"       # RTSP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC
      - "8890:8890/udp"   # SRT
    networks:
      - media-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9997/v3/paths/list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  stream-compositor:
    build: ./stream-compositor
    container_name: influencer-compositor
    shm_size: '2gb'
    environment:
      AVATAR_URL: http://avatar-frontend:8080
      MEDIAMTX_RTMP: rtmp://mediamtx:1935/live/influencer
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: recordings
      MINIO_USE_SSL: "false"
      DISPLAY: ":99"
      STREAM_WIDTH: 1920
      STREAM_HEIGHT: 1080
      STREAM_FPS: 30
      STREAM_BITRATE: 4000k
      PORT: 5000
    networks:
      - media-net
      - data-net
    depends_on:
      avatar-frontend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4'
